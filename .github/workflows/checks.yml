name: Check backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blog_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run worker:check
        working-directory: backend
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm test
        working-directory: backend
        env:
          WORKER_TEST_DATABASE_URL: postgresql://blog_test:test_only_password@127.0.0.1:5432/blog_test
